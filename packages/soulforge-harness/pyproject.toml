[project]
name = "soulforge-harness"
version = "0.1.0"
description = "Portable AI personality harness: .soul identity format, persona/emotion/relationship math, life-simulation runtime, and the embodiment protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SoulForge" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
# 核心零三方依赖：身份、人格数学、生活运行时全部纯标准库
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42"]   # .soul 口令加密（不装则仅支持明文包）
ws = ["websockets>=13"]         # Protocol 0.2 服务宿主

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulforge_harness"]
