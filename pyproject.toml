[project]
name = "soulforge"
version = "0.1.0"
description = "SoulForge - AI Toy Soul Injection Platform"
requires-python = ">=3.12"
# Workspace members as root deps: a bare `uv run` re-syncs the venv to the
# root project spec and would otherwise UNINSTALL ai-core/gateway mid-work.
dependencies = [
    "ai-core",
    "gateway",
]

[tool.uv.workspace]
members = [
    "packages/ai-core",
    "packages/gateway",
]

[tool.uv.sources]
ai-core = { workspace = true }
gateway = { workspace = true }

[dependency-groups]
dev = [
    "protobuf>=7.34.1",
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]
mujoco-demo = [
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "mujoco>=3.3.0",
    "pillow>=11.0.0",
]

[tool.pytest.ini_options]
# root suite only; campus_sim_project has its own same-named test modules
testpaths = ["tests"]
norecursedirs = ["campus_sim_project", "packages", "node_modules", ".venv", "outputs", "unity"]
