[package]
name = "soulforge-desktop"
version = "0.1.0"
description = "SoulForge Live — desktop shell (main window + transparent always-on-top companion overlay)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "soulforge_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
cpal = "0.15"
base64 = "0.22"
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
