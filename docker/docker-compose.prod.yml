version: "3.8"

services:
  # ─── Infrastructure ────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: soulforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-soulforge_prod}
      POSTGRES_DB: soulforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-soulforge_redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-soulforge_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Application Services ──────────────────────
  admin-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin-web
    environment:
      DATABASE_URL: postgresql://soulforge:${DB_PASSWORD:-soulforge_prod}@postgres:5432/soulforge
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      AI_CORE_URL: http://ai-core:8100
      SERVICE_TOKEN: ${SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ai-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai-core
    environment:
      DATABASE_URL: postgresql://soulforge:${DB_PASSWORD:-soulforge_prod}@postgres:5432/soulforge
      REDIS_URL: redis://:${REDIS_PASSWORD:-soulforge_redis}@redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-dashscope}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-7b-instruct}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-dashscope}
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
      FISH_AUDIO_MODEL: ${FISH_AUDIO_MODEL:-s1}
      ASR_PROVIDER: ${ASR_PROVIDER:-dashscope}
      MASTER_SECRET: ${MASTER_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    environment:
      DATABASE_URL: postgresql://soulforge:${DB_PASSWORD:-soulforge_prod}@postgres:5432/soulforge
      REDIS_URL: redis://:${REDIS_PASSWORD:-soulforge_redis}@redis:6379/0
      AI_CORE_URL: http://ai-core:8100
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      ENVIRONMENT: production
    depends_on:
      ai-core:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Reverse Proxy ─────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin-web
      - ai-core
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
