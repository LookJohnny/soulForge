<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoulForge · Evening Companion Demo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
      body { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .hud { position: fixed; z-index: 10; color: #eaf2ff; }

      .top-left { top: 26px; left: 30px; }
      .top-left .dayline { font-size: 12px; letter-spacing: 0.22em; color: #9db4d4; text-transform: uppercase; }
      .top-left .clock { font-size: 44px; font-weight: 700; letter-spacing: 0.04em; line-height: 1.1;
        text-shadow: 0 2px 18px rgba(80,160,255,0.45); font-variant-numeric: tabular-nums; }
      .top-left .phase { font-size: 13px; color: #ffc98a; letter-spacing: 0.14em; }

      .brand { top: 26px; right: 30px; text-align: right; }
      .brand b { font-size: 15px; letter-spacing: 0.08em; color: #cfe4ff; }
      .brand small { display: block; font-size: 11px; color: #7f95b5; letter-spacing: 0.18em; margin-top: 3px; }

      .plan-panel { right: 30px; top: 96px; width: 250px; background: rgba(9,14,24,0.72);
        border: 1px solid rgba(120,170,255,0.22); border-radius: 14px; padding: 13px 15px;
        backdrop-filter: blur(6px); }
      .plan-panel h4 { font-size: 11px; letter-spacing: 0.2em; color: #8fb0dd; margin-bottom: 9px;
        display: flex; justify-content: space-between; align-items: center; }
      .plan-panel h4 em { font-style: normal; font-size: 10px; padding: 2px 8px; border-radius: 20px;
        background: rgba(114,224,181,0.16); color: #72e0b5; letter-spacing: 0.06em; }
      .plan-panel h4 em.rewritten { background: rgba(255,170,90,0.2); color: #ffbe7a; }
      .plan-panel .item { font-size: 12.5px; color: #d7e6ff; padding: 5px 0 5px 16px; position: relative; line-height: 1.35; }
      .plan-panel .item::before { content: ""; position: absolute; left: 2px; top: 11px; width: 6px; height: 6px;
        border-radius: 50%; background: #5f7ea8; }
      .plan-panel .item.new { color: #ffe1b8; }
      .plan-panel .item.new::before { background: #ffb668; box-shadow: 0 0 8px rgba(255,182,104,0.8); }
      .plan-panel.flash { animation: panelflash 0.9s ease; }
      @keyframes panelflash { 0% { border-color: rgba(255,190,122,0.95); box-shadow: 0 0 30px rgba(255,170,90,0.35);} 100% { border-color: rgba(120,170,255,0.22); box-shadow: none; } }

      .event-toast { top: 92px; left: 50%; transform: translateX(-50%); min-width: 380px; max-width: 560px;
        background: rgba(10,16,28,0.86); border: 1px solid rgba(255,190,122,0.5); border-radius: 14px;
        padding: 12px 18px; opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; text-align: center; }
      .event-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
      .event-toast .etext { font-size: 15px; color: #ffe9cf; }
      .event-toast .edecision { margin-top: 7px; font-size: 11.5px; color: #9fb8dc; letter-spacing: 0.03em; }
      .event-toast .chip { display: inline-block; margin-right: 8px; padding: 2px 9px; border-radius: 20px;
        font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; }
      .chip.high { background: rgba(255,110,110,0.2); color: #ff9d9d; border: 1px solid rgba(255,120,120,0.4); }
      .chip.low { background: rgba(114,224,181,0.14); color: #72e0b5; border: 1px solid rgba(114,224,181,0.35); }

      .dialogue { left: 50%; bottom: 44px; transform: translateX(-50%); width: min(860px, 82vw);
        background: linear-gradient(180deg, rgba(10,15,26,0.55), rgba(8,12,22,0.88));
        border: 1px solid rgba(140,180,240,0.18); border-left: 4px solid var(--speaker, #8ecae6);
        border-radius: 16px; padding: 14px 22px; display: flex; align-items: center; gap: 18px;
        opacity: 0; transition: opacity 0.22s ease; backdrop-filter: blur(8px); }
      .dialogue.active { opacity: 1; }
      .dialogue .speaker { font-size: 14px; font-weight: 700; color: var(--speaker, #8ecae6);
        letter-spacing: 0.06em; white-space: nowrap; }
      .dialogue .copy { display: flex; flex-direction: column; gap: 2px; }
      .dialogue .line { font-size: 19px; color: #f4f8ff; line-height: 1.4; }
      .dialogue .line-en { font-size: 12.5px; color: #91a7c8; letter-spacing: 0.02em; line-height: 1.3; font-style: italic; }
      .dialogue .wave { display: flex; gap: 3px; margin-left: auto; align-items: flex-end; height: 18px; }
      .dialogue .wave span { width: 3.5px; border-radius: 2px; background: var(--speaker, #8ecae6);
        animation: wavebar 0.85s ease-in-out infinite; }
      .dialogue .wave span:nth-child(2) { animation-delay: 0.12s; }
      .dialogue .wave span:nth-child(3) { animation-delay: 0.24s; }
      .dialogue .wave span:nth-child(4) { animation-delay: 0.36s; }
      @keyframes wavebar { 0%,100% { height: 5px; } 50% { height: 18px; } }

      .nametags { position: fixed; inset: 0; pointer-events: none; z-index: 8; }
      .name-tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 7px;
        background: rgba(8,13,24,0.72); border: 1px solid rgba(150,190,255,0.2); border-radius: 20px;
        padding: 4px 12px 4px 8px; transition: opacity 0.3s; }
      .name-tag span { width: 8px; height: 8px; border-radius: 50%; background: var(--agent, #fff); }
      .name-tag strong { font-size: 12.5px; color: #eef4ff; letter-spacing: 0.05em; }
      .name-tag small { font-size: 10.5px; color: #96abcc; }

      .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #05070c; color: #9db4d4; font-size: 15px; letter-spacing: 0.3em; z-index: 50; }
      .loading.hidden { display: none; }

      .letterbox { position: fixed; left: 0; right: 0; height: 5.4vh; background: #000; z-index: 6; }
      .letterbox.top { top: 0; } .letterbox.bottom { bottom: 0; }

      body.clean .plan-panel, body.clean .event-toast, body.clean .brand { display: none; }

      /* opening & closing brand cards */
      .card-overlay { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; pointer-events: none;
        opacity: 0; transition: none; }
      .card-overlay.opening { background: radial-gradient(ellipse at 50% 42%, #0d1524 0%, #05070c 70%); }
      .card-overlay.closing { background: rgba(4, 6, 11, 0.55); backdrop-filter: blur(2px); }
      .card-overlay .logo { font-size: 64px; font-weight: 800; letter-spacing: 0.06em; color: #eef5ff;
        text-shadow: 0 4px 40px rgba(110, 180, 255, 0.55); }
      .card-overlay .logo em { font-style: normal; color: #8ecae6; }
      .card-overlay .tagline { font-size: 19px; color: #b9cbe8; letter-spacing: 0.35em; }
      .card-overlay .tagline-cn { font-size: 15px; color: #7d92b5; letter-spacing: 0.5em; margin-top: 2px; }
      .card-overlay .rule { width: 320px; height: 1px; margin: 10px 0;
        background: linear-gradient(90deg, transparent, rgba(142,202,230,0.8), transparent); }

      /* scale non-projected HUD up on HD captures (nametags are projected in px, excluded) */
      body.hd .top-left, body.hd .brand, body.hd .plan-panel, body.hd .event-toast,
      body.hd .dialogue, body.hd .card-overlay { zoom: 1.5; }
      body.hd .name-tag strong { font-size: 17px; }
      body.hd .name-tag small { font-size: 14px; }
      body.hd .name-tag { padding: 6px 16px 6px 11px; border-radius: 26px; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="hud top-left">
      <div class="dayline">Day 1 · Evening at Home</div>
      <div class="clock" id="clock">20:47</div>
      <div class="phase" id="phase">晚餐 & 一天收尾</div>
    </div>
    <div class="hud brand">
      <b>SoulForge</b>
      <small>PHYSICAL AI · COMPANION ENGINE</small>
    </div>
    <div class="hud plan-panel" id="plan-panel">
      <h4>今晚计划 <em id="plan-state">RUNNING</em></h4>
      <div id="plan-items"></div>
    </div>
    <div class="hud event-toast" id="event-toast">
      <div class="etext" id="event-text"></div>
      <div class="edecision" id="event-decision"></div>
    </div>
    <div class="hud dialogue" id="dialogue">
      <div class="speaker" id="dialogue-speaker"></div>
      <div class="copy">
        <div class="line" id="dialogue-line"></div>
        <div class="line-en" id="dialogue-line-en"></div>
      </div>
      <div class="wave"><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="card-overlay opening" id="titlecard">
      <div class="logo">Soul<em>Forge</em></div>
      <div class="rule"></div>
      <div class="tagline">PHYSICAL AI · COMPANION ENGINE</div>
      <div class="tagline-cn">会重新规划生活的陪伴引擎</div>
    </div>
    <div class="card-overlay closing" id="endcard">
      <div class="logo">Soul<em>Forge</em></div>
      <div class="rule"></div>
      <div class="tagline">A HOME THAT RUNS ITSELF</div>
      <div class="tagline-cn">计划 · 中断 · 重规划 · 陪伴</div>
    </div>
    <div class="nametags" id="nametags"></div>
    <div id="loading" class="loading">LOADING COMPANIONS…</div>
    <script type="module" src="/demo/vtuber_life_web/src/dinner.js"></script>
  </body>
</html>
