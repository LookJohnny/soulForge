<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>SoulForge Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/examples/jsm/": "/node_modules/three/examples/jsm/",
      "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
      "@pixiv/three-vrm-animation": "/node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap" />
  <link rel="stylesheet" href="/studio/live.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <!-- 3D 气泡：跟随头部投影 -->
  <div id="bubble" class="bubble hidden"><span id="bubble-text"></span></div>
  <div id="typing" class="bubble typing hidden"><i></i><i></i><i></i></div>

  <!-- 左上：状态 HUD -->
  <section id="hud">
    <div class="hud-row"><span id="hud-name">—</span><span id="hud-stage" class="pill" title="关系阶段">未连接</span></div>
    <div id="hud-rel" class="hud-block"></div>
    <div id="hud-mood" class="hud-block"><span id="hud-emotion"></span><small id="hud-causes"></small></div>
    <details id="hud-pad"><summary>PAD</summary><div id="pad"></div></details>
  </section>

  <!-- 右上：工具按钮 -->
  <nav id="tools">
    <button id="btn-memory" title="记忆图">◎</button>
    <button id="btn-settings" title="设置">⚙</button>
  </nav>

  <!-- 记忆图面板（Phase 5 填充） -->
  <aside id="memory-panel" class="panel hidden">
    <header><b>记忆图</b><button class="close" data-close="memory-panel">×</button></header>
    <canvas id="memory-canvas" width="292" height="260"></canvas>
    <p class="muted" id="memory-hint">连接后显示（需 ai-core）</p>
    <div class="row"><button id="btn-memory-refresh">刷新</button><span class="muted" id="memory-stats"></span></div>
  </aside>

  <!-- 设置抽屉 -->
  <aside id="settings-panel" class="panel hidden">
    <header><b>设置</b><button class="close" data-close="settings-panel">×</button></header>
    <div class="sec">连接</div>
    <label>Gateway（语音/记忆/关系）<input id="gw" type="text" placeholder="ws://localhost:8080/ws" /></label>
    <label>Runtime Server /body（可选：引擎动作驱动）<input id="runtime" type="text" placeholder="ws://localhost:8765/body" /></label>
    <label>身体承载的角色 id（逗号分隔，空=全部）<input id="runtime-agents" type="text" placeholder="luna" /></label>
    <div class="row"><button id="connect-body">连接身体</button><span class="muted" id="body-status">未连接（可选）</span></div>
    <div class="sec">外观</div>
    <label>模型<select id="model"></select></label>
    <label>动作<select id="anim"><option value="">（一次性动作）</option></select></label>
    <label class="row"><input id="opt-idle" type="checkbox" checked /> 使用 idle 动捕片段</label>
    <label class="row"><input id="opt-toon" type="checkbox" /> 卡通外观（非 VRM 模型默认开）</label>
    <div class="sec">关系</div>
    <label class="row"><input id="opt-companion" type="checkbox" /> 陪伴模式（锁定关系轴，不走感情线）</label>
    <div class="row"><button id="connect">重新连接</button><button id="btn-export" disabled>导出进度</button><label class="row" style="margin:0"><input id="file-import" type="file" accept="application/json" hidden /><button type="button" id="btn-import" disabled>导入进度</button></label></div>
    <div class="sec">灵魂包 .soul</div>
    <div class="row" title="一个 .soul = 人格+音色+外观+表情的完整角色包，可跨身体/跨品牌传递"><select id="soul-char"></select><button type="button" id="btn-soul-export">导出 .soul</button><input id="file-soul" type="file" accept=".soul,.soulpack" hidden /><button type="button" id="btn-soul-import">导入 .soul</button></div>
    <div class="row"><button type="button" id="btn-quiz">灵魂问卷 · 生成我的专属角色</button></div>
    <p class="muted" id="near-events"></p>
    <p class="muted" id="status">未连接</p>
  </aside>

  <!-- 事件场景卡（Phase 4 填充） -->
  <div id="event-overlay" class="hidden"></div>

  <!-- 灵魂问卷 -->
  <div id="quiz-overlay" class="hidden"></div>

  <!-- 底部聊天条 -->
  <form id="chatbar">
    <button type="button" id="mic" title="麦克风常开（服务端 VAD 断句）">🎙</button>
    <input id="text" type="text" placeholder="说点什么…" autocomplete="off" />
    <button type="submit" id="send">发送</button>
    <button type="button" id="stop" title="打断">■</button>
  </form>
  <div id="log" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <script type="module" src="/studio/live.js"></script>
</body>
</html>
